name: Deploy Public Demo (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Demo base URL (custom domain or github.io fallback)"
        required: true
        default: "https://demo.irchrome.art"
        type: choice
        options:
          - "https://demo.irchrome.art"
          - "https://irchrome.github.io/irchrome-art-demo"

permissions:
  contents: read

concurrency:
  group: "pages-demo"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.23.6"
    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard — refuse production domain
        run: |
          if [ "${{ inputs.base_url }}" = "https://irchrome.art" ]; then
            echo "Refusing to deploy production domain from demo workflow." >&2
            exit 1
          fi

      - name: Install pinned Zola
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zola.tar.gz
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo mv /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Build demo site
        run: zola --config config.demo.toml build --base-url "${{ inputs.base_url }}" --output-dir public

      - name: Verify demo artifact (noindex, zero Pic-Time, clean media)
        run: python3 scripts/verify_build.py --dir public --base-url "${{ inputs.base_url }}" --mode demo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
